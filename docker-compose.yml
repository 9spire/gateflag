services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    container_name: gateflag-dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: gateflag-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb-local

  seed:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: gateflag-seed
    restart: "no"
    environment:
      STORAGE: dynamo
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE_NAME: gateflag
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      ALLOWED_ACCESS_CLIENTS: storefront,checkout,support-portal
      PORT: "3003"
      LOG_LEVEL: info
    depends_on:
      - dynamodb-local
    command: ["node", "api/dist/scripts/setup-and-seed.js"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: gateflag-api
    ports:
      - "3003:3003"
    environment:
      STORAGE: dynamo
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE_NAME: gateflag
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      ALLOWED_ACCESS_CLIENTS: storefront,checkout,support-portal
      ALLOWED_ORIGINS: http://localhost:8080
      PORT: "3003"
      LOG_LEVEL: info
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: demo/Dockerfile
    container_name: gateflag-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
