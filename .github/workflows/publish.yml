name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./react/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match react/package.json version $PKG"
            exit 1
          fi
      - run: npm run build -w @gateflag/core && npm run build -w gateflag
      - name: Stage gateflag for npm
        run: npm stage publish -w gateflag --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Next step
        run: |
          echo "Staged gateflag@${GITHUB_REF_NAME#v}."
          echo "Approve with 2FA: https://www.npmjs.com/settings/~/staged-packages"
          echo "Or: npm stage list && npm stage approve <stage-id>"
